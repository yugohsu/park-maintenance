<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日本樂園設施維修查詢</title>
<style>
  :root {
    --navy: #0A2A66;
    --blue: #1450B4;
    --sky: #E8F0FC;
    --yellow: #FFC72C;
    --yellow-dark: #E6A800;
    --red: #C62828;
    --text: #14213D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--sky); color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-weight: 700; font-size: 19px; line-height: 1.5; }
  header { background: var(--navy); color: var(--yellow); padding: 18px 18px 14px;
    padding-top: calc(18px + env(safe-area-inset-top)); border-bottom: 6px solid var(--yellow); }
  header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
  header .sub { color: #fff; font-size: 15px; margin-top: 4px; opacity: .9; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
  .card { background: #fff; border-radius: 16px; border: 3px solid var(--blue);
    overflow: hidden; margin-bottom: 16px; }
  .card > h2 { margin: 0; background: var(--blue); color: #fff; font-size: 19px; padding: 8px 14px; }
  .card .body { padding: 14px; }
  .row { display: flex; gap: 10px; }
  .row > label { flex: 1; min-width: 0; }
  label span { display: block; color: var(--navy); font-size: 17px; margin-bottom: 4px; }
  input[type=date] { width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; font: inherit; font-size: 20px; padding: 10px 8px;
    border: 2px solid var(--blue); border-radius: 10px; color: var(--navy); background: #fff; min-height: 52px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .quick button { font: inherit; font-size: 17px; padding: 8px;
    border-radius: 10px; border: 2px solid var(--blue); background: #fff; color: var(--blue); }
  .parks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .park-btn { font: inherit; font-size: 18px; padding: 14px 8px; border-radius: 12px;
    border: 3px solid var(--blue); background: #fff; color: var(--blue); }
  .park-btn.on { background: var(--navy); color: var(--yellow); border-color: var(--navy); }
  .go { display: block; width: 100%; font: inherit; font-size: 28px; padding: 18px;
    border: 0; border-radius: 16px; background: var(--yellow); color: var(--navy);
    box-shadow: 0 5px 0 var(--yellow-dark); margin: 6px 0 20px; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--yellow-dark); }
  .summary { font-size: 20px; color: var(--navy); margin: 0 4px 12px; }
  .park-head { background: var(--navy); color: #fff; padding: 10px 14px; font-size: 21px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .park-head .count { background: var(--yellow); color: var(--navy); border-radius: 999px;
    padding: 2px 12px; font-size: 17px; white-space: nowrap; }
  .item { padding: 12px 14px; border-bottom: 2px solid var(--sky); }
  .item:last-child { border-bottom: 0; }
  .date { display: inline-block; background: var(--yellow); color: var(--navy); border-radius: 8px;
    padding: 2px 10px; font-size: 17px; margin: 0 6px 6px 0; }
  .orig { color: #5A6785; font-size: 16px; margin-top: 4px; } .none { padding: 14px; color: var(--blue); }
  .error { padding: 14px; color: var(--red); }
  .site { display: block; padding: 12px 14px; background: var(--sky); color: var(--blue);
    text-decoration: none; font-size: 17px; border-top: 2px solid var(--sky); }
  .bottom { display: flex; gap: 10px; }
  .bottom button { flex: 1; font: inherit; font-size: 19px; padding: 14px; border-radius: 14px;
    border: 3px solid var(--blue); background: #fff; color: var(--blue); }
  .meta { text-align: center; font-size: 15px; color: #4A5A80; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--navy); color: var(--yellow); padding: 14px 24px; border-radius: 999px;
    font-size: 19px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>樂園設施維修查詢</h1>
  <div class="sub" id="updated">資料載入中…</div>
</header>

<main>
  <section class="card">
    <h2>1. 選日期</h2>
    <div class="body">
      <div class="row">
        <label><span>開始</span><input type="date" id="start"></label>
        <label><span>結束</span><input type="date" id="end"></label>
      </div>
      <div class="quick">
        <button data-q="0">今天</button>
        <button data-q="1">明天</button>
        <button data-q="7">未來 7 天</button>
        <button data-q="30">未來 30 天</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>2. 選樂園（可多選）</h2>
    <div class="body"><div class="parks" id="parks"></div></div>
  </section>

  <button class="go" id="go">查詢</button>

  <div id="results"></div>

  <div class="bottom hidden" id="actions">
    <button id="copy">複製結果（貼 LINE）</button>
  </div>

  <div class="meta" id="meta"></div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  var DATA = null;
  var selected = {};
  var lastText = "";
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function md(s) { var p = s.split("-"); var y = (+p[0] !== new Date().getFullYear()) ? p[0] + "/" : ""; return y + +p[1] + "/" + +p[2]; }
  function label(p) {
    if (!p[1]) return md(p[0]) + " 起 長期休止";
    if (p[0] === p[1]) return md(p[0]);
    return md(p[0]) + " ~ " + md(p[1]);
  }
  function overlap(p, s, e) { return p[0] <= e && (p[1] === null || p[1] >= s); }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function setRange(n) {
    var t = new Date();
    if (n === 0) { $("start").value = ymd(t); $("end").value = ymd(t); }
    else if (n === 1) { $("start").value = ymd(addDays(t, 1)); $("end").value = ymd(addDays(t, 1)); }
    else { $("start").value = ymd(t); $("end").value = ymd(addDays(t, n - 1)); }
  }

  function buildParks() {
    var saved = (load("parks") || "").split(",").filter(Boolean);
    var box = $("parks"); box.innerHTML = "";
    DATA.parks.forEach(function (p) {
      selected[p.id] = saved.length ? saved.indexOf(p.id) >= 0 : true;
      var b = document.createElement("button");
      b.className = "park-btn" + (selected[p.id] ? " on" : "");
      b.textContent = p.name;
      b.onclick = function () {
        selected[p.id] = !selected[p.id];
        b.classList.toggle("on", selected[p.id]);
        store("parks", Object.keys(selected).filter(function (k) { return selected[k]; }).join(","));
      };
      box.appendChild(b);
    });
  }

  function search() {
    var s = $("start").value, e = $("end").value;
    if (!s || !e) { toast("請先選日期"); return; }
    if (e < s) { var t = s; s = e; e = t; $("start").value = s; $("end").value = e; }
    var parks = DATA.parks.filter(function (p) { return selected[p.id]; });
    if (!parks.length) { toast("請至少選一個樂園"); return; }

    var rangeTxt = s === e ? s : s + " ~ " + e;
    var html = "", total = 0;
    var txt = ["樂園設施維修查詢（" + rangeTxt + "）", ""];

    parks.forEach(function (p) {
      var hits = [];
      if (p.status === "ok") {
        p.items.forEach(function (it) {
          if (it.periods.some(function (q) { return overlap(q, s, e); })) hits.push(it);
        });
      }
      total += hits.length;
      html += '<section class="card"><div class="park-head"><span>' + esc(p.name) + "</span>";
      if (p.status === "ok") html += '<span class="count">' + (hits.length ? hits.length + " 筆" : "無") + "</span>";
      html += "</div>";
      txt.push("【" + p.name + "】");
      if (p.status !== "ok") {
        html += '<div class="error">這次自動抓取失敗：' + esc(p.error || "未知錯誤") + "<br>請點下方官網自行確認。</div>";
        txt.push("自動抓取失敗，請看官網");
      } else if (!hits.length) {
        html += '<div class="none">這段期間沒有找到維修設施</div>';
        txt.push("無維修設施");
      } else {
        hits.forEach(function (it) {
          var labels = it.periods.filter(function (q) { return overlap(q, s, e); }).map(label);
          html += '<div class="item">' + labels.map(function (l) {
            return '<span class="date">' + esc(l) + "</span>"; }).join("") +
            "<div>" + esc(it.text_zh || it.text) + "</div>" + (it.text_zh ? '<div class="orig">原文：' + esc(it.text) + "</div>" : "") + "</div>";
          txt.push("・" + labels.join("、") + " " + (it.text_zh || it.text));
        });
      }
      html += '<a class="site" href="' + esc(p.url) + '" target="_blank" rel="noopener">開啟官網確認</a></section>';
      txt.push("");
    });

    $("results").innerHTML = '<div class="summary">' + esc(rangeTxt) + "，共找到 " + total + " 筆</div>" + html;
    $("actions").classList.remove("hidden");
    lastText = txt.join("\n").trim();
    store("range", s + "|" + e);
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function copy() {
    if (!lastText) return;
    var done = function () { toast("已複製，可貼到 LINE"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = lastText; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("複製失敗"); }
      document.body.removeChild(ta);
    }
  }

  // 初始化
  var r = (load("range") || "").split("|");
  if (r.length === 2 && r[1] >= ymd(new Date())) { $("start").value = r[0]; $("end").value = r[1]; }
  else setRange(7);

  Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function (b) {
    b.onclick = function () { setRange(+b.getAttribute("data-q")); };
  });
  $("go").onclick = search;
  $("copy").onclick = copy;

  fetch("data.json?t=" + Date.now()).then(function (res) {
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }).then(function (d) {
    DATA = d;
    $("updated").textContent = "資料更新：" + d.generated_at + "（每天自動更新）";
    $("meta").textContent = "可查詢範圍：" + d.window[0] + " ~ " + d.window[1] + "。實際狀況以各樂園官網為準。";
    buildParks();
  }).catch(function () {
    $("updated").textContent = "資料讀取失敗，請稍後重新整理";
  });
})();
</script>
</body>
</html>
