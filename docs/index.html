<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日本樂園設施維修查詢</title>
<style>
  :root {
    --navy: #0A2A66;
    --blue: #1450B4;
    --sky: #E8F0FC;
    --yellow: #FFC72C;
    --yellow-dark: #E6A800;
    --red: #C62828;
    --text: #14213D;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--sky); color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    font-weight: 700; font-size: 19px; line-height: 1.5; }
  header { background: var(--navy); color: var(--yellow); padding: 18px 18px 14px;
    padding-top: calc(18px + env(safe-area-inset-top)); border-bottom: 6px solid var(--yellow); }
  header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
  header .sub { color: #fff; font-size: 15px; margin-top: 4px; opacity: .9; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 60px; }
  .card { background: #fff; border-radius: 16px; border: 3px solid var(--blue);
    overflow: hidden; margin-bottom: 16px; }
  .card > h2 { margin: 0; background: var(--blue); color: #fff; font-size: 19px; padding: 8px 14px; }
  .card .body { padding: 14px; }
  .row { display: flex; gap: 10px; }
  .row > label { flex: 1; min-width: 0; }
  label span { display: block; color: var(--navy); font-size: 17px; margin-bottom: 4px; }
  input[type=date] { width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; font: inherit; font-size: 20px; padding: 10px 8px;
    border: 2px solid var(--blue); border-radius: 10px; color: var(--navy); background: #fff; min-height: 52px; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .quick button { font: inherit; font-size: 17px; padding: 8px;
    border-radius: 10px; border: 2px solid var(--blue); background: #fff; color: var(--blue); }
  .parks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .park-btn { font: inherit; font-size: 18px; padding: 14px 8px; border-radius: 12px;
    border: 3px solid var(--blue); background: #fff; color: var(--blue); }
  .park-btn.on { background: var(--navy); color: var(--yellow); border-color: var(--navy); }
  .go { display: block; width: 100%; font: inherit; font-size: 28px; padding: 18px;
    border: 0; border-radius: 16px; background: var(--yellow); color: var(--navy);
    box-shadow: 0 5px 0 var(--yellow-dark); margin: 6px 0 20px; }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--yellow-dark); }
  .summary { font-size: 20px; color: var(--navy); margin: 0 4px 12px; }
  .park-head { background: var(--navy); color: #fff; padding: 10px 14px; font-size: 21px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .park-head .count { background: var(--yellow); color: var(--navy); border-radius: 999px;
    padding: 2px 12px; font-size: 17px; white-space: nowrap; }
  .item { padding: 12px 14px; border-bottom: 2px solid var(--sky); }
  .item:last-child { border-bottom: 0; }
  .date { display: inline-block; background: var(--yellow); color: var(--navy); border-radius: 8px;
    padding: 2px 10px; font-size: 17px; margin: 0 6px 6px 0; }
  .orig { color: #5A6785; font-size: 16px; margin-top: 4px; } .none { padding: 14px; color: var(--blue); }
  .error { padding: 14px; color: var(--red); }
  .site { display: block; padding: 12px 14px; background: var(--sky); color: var(--blue);
    text-decoration: none; font-size: 17px; border-top: 2px solid var(--sky); }
  .bottom { display: flex; gap: 10px; }
  .bottom button { flex: 1; font: inherit; font-size: 19px; padding: 14px; border-radius: 14px;
    border: 3px solid var(--blue); background: #fff; color: var(--blue); }
  .meta { text-align: center; font-size: 15px; color: #4A5A80; margin-top: 18px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--navy); color: var(--yellow); padding: 14px 24px; border-radius: 999px;
    font-size: 19px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .tab { font: inherit; font-size: 21px; padding: 14px 6px; border-radius: 14px; border: 3px solid var(--navy);
    background: #fff; color: var(--navy); }
  .tab.on { background: var(--navy); color: var(--yellow); }
  .item2 { font: inherit; font-size: 19px; padding: 16px 6px; border-radius: 12px; border: 3px solid var(--blue);
    background: #fff; color: var(--blue); line-height: 1.3; }
  .item2 small { display: block; font-size: 15px; }
  .item2.on { background: var(--navy); color: var(--yellow); border-color: var(--navy); }
  input[type=text], input[type=password] { width: 100%; font: inherit; font-size: 20px; padding: 10px; border: 2px solid var(--blue);
    border-radius: 10px; color: var(--navy); min-height: 52px; background: #fff; -webkit-appearance: none; appearance: none; }
  .pv { margin-top: 12px; background: var(--sky); border-radius: 10px; padding: 10px 12px; color: var(--navy); }
  .warn { color: var(--red); }
  .rem { padding: 12px 14px; border-bottom: 2px solid var(--sky); }
  .rem:last-child { border-bottom: 0; }
  .rem .t { font-size: 20px; color: var(--navy); }
  .rem .mt { font-size: 17px; color: var(--blue); margin-top: 4px; }
  .tag.done { background: #D6E4F7; }
  .tag { display: inline-block; background: var(--yellow); color: var(--navy); border-radius: 8px; padding: 1px 10px; margin: 4px 6px 0 0; font-size: 17px; }
  .del { float: right; font: inherit; font-size: 16px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--red); background: #fff; color: var(--red); }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>樂園設施維修查詢</h1>
  <div class="sub" id="updated">資料載入中…</div>
</header>

<main>
  <div class="tabs">
    <button class="tab on" data-tab="check">維修查詢</button>
    <button class="tab" data-tab="remind">購票提醒</button>
  </div>

  <div id="tab-check">
  <section class="card">
    <h2>1. 選日期</h2>
    <div class="body">
      <div class="row">
        <label><span>開始</span><input type="date" id="start"></label>
        <label><span>結束</span><input type="date" id="end"></label>
      </div>
      <div class="quick">
        <button data-q="0">今天</button>
        <button data-q="1">明天</button>
        <button data-q="7">未來 7 天</button>
        <button data-q="30">未來 30 天</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>2. 選樂園（可多選）</h2>
    <div class="body"><div class="parks" id="parks"></div></div>
  </section>

  <button class="go" id="go">查詢</button>

  <div id="results"></div>

  <div class="bottom hidden" id="actions">
    <button id="copy">複製結果（貼 LINE）</button>
  </div>

  <div class="meta" id="meta"></div>
  </div>

  <div id="tab-remind" class="hidden">
    <section class="card">
      <h2>1. 要買什麼</h2>
      <div class="body parks">
        <button class="item2 on" data-item="usj">USJ 快通<small>入園前 2 個月開賣</small></button>
        <button class="item2" data-item="suzuka">賽道挑戰者<small>入園前 42 天開賣</small></button>
      </div>
    </section>
    <section class="card">
      <h2>2. 哪天入園</h2>
      <div class="body">
        <label><span>入園日期</span><input type="date" id="rVisit"></label>
        <label><span>備註（例如團名，可不填）</span><input type="text" id="rNote" maxlength="40" placeholder="例如：2月親子團"></label>
        <div class="pv" id="rPreview">選好日期後，這裡會顯示開賣時間</div>
      </div>
    </section>
    <button class="go" id="rAdd">加入提醒</button>
    <section class="card">
      <h2>已設定的提醒</h2>
      <div id="rList"><div class="none">讀取中…</div></div>
    </section>
    <section class="card">
      <h2>設定</h2>
      <div class="body">
        <label><span>通行碼</span><input type="password" id="rKey" placeholder="第一次使用請輸入"></label>
        <div class="bottom" style="margin-top:12px"><button id="rSaveKey">儲存通行碼</button><button id="rTest">測試 LINE</button></div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  var DATA = null;
  var selected = {};
  var lastText = "";
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function md(s) { var p = s.split("-"); var y = (+p[0] !== new Date().getFullYear()) ? p[0] + "/" : ""; return y + +p[1] + "/" + +p[2]; }
  function label(p) {
    if (!p[1]) return md(p[0]) + " 起 長期休止";
    if (p[0] === p[1]) return md(p[0]);
    return md(p[0]) + " ~ " + md(p[1]);
  }
  function overlap(p, s, e) { return p[0] <= e && (p[1] === null || p[1] >= s); }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function setRange(n) {
    var t = new Date();
    if (n === 0) { $("start").value = ymd(t); $("end").value = ymd(t); }
    else if (n === 1) { $("start").value = ymd(addDays(t, 1)); $("end").value = ymd(addDays(t, 1)); }
    else { $("start").value = ymd(t); $("end").value = ymd(addDays(t, n - 1)); }
  }

  function buildParks() {
    var saved = (load("parks") || "").split(",").filter(Boolean);
    var box = $("parks"); box.innerHTML = "";
    DATA.parks.forEach(function (p) {
      selected[p.id] = saved.length ? saved.indexOf(p.id) >= 0 : true;
      var b = document.createElement("button");
      b.className = "park-btn" + (selected[p.id] ? " on" : "");
      b.textContent = p.name;
      b.onclick = function () {
        selected[p.id] = !selected[p.id];
        b.classList.toggle("on", selected[p.id]);
        store("parks", Object.keys(selected).filter(function (k) { return selected[k]; }).join(","));
      };
      box.appendChild(b);
    });
  }

  function search() {
    var s = $("start").value, e = $("end").value;
    if (!s || !e) { toast("請先選日期"); return; }
    if (e < s) { var t = s; s = e; e = t; $("start").value = s; $("end").value = e; }
    var parks = DATA.parks.filter(function (p) { return selected[p.id]; });
    if (!parks.length) { toast("請至少選一個樂園"); return; }

    var rangeTxt = s === e ? s : s + " ~ " + e;
    var html = "", total = 0;
    var txt = ["樂園設施維修查詢（" + rangeTxt + "）", ""];

    parks.forEach(function (p) {
      var hits = [];
      if (p.status === "ok") {
        p.items.forEach(function (it) {
          if (it.periods.some(function (q) { return overlap(q, s, e); })) hits.push(it);
        });
      }
      total += hits.length;
      html += '<section class="card"><div class="park-head"><span>' + esc(p.name) + "</span>";
      if (p.status === "ok") html += '<span class="count">' + (hits.length ? hits.length + " 筆" : "無") + "</span>";
      html += "</div>";
      txt.push("【" + p.name + "】");
      if (p.status !== "ok") {
        html += '<div class="error">這次自動抓取失敗：' + esc(p.error || "未知錯誤") + "<br>請點下方官網自行確認。</div>";
        txt.push("自動抓取失敗，請看官網");
      } else if (!hits.length) {
        html += '<div class="none">這段期間沒有找到維修設施</div>';
        txt.push("無維修設施");
      } else {
        hits.forEach(function (it) {
          var labels = it.periods.filter(function (q) { return overlap(q, s, e); }).map(label);
          html += '<div class="item">' + labels.map(function (l) {
            return '<span class="date">' + esc(l) + "</span>"; }).join("") +
            "<div>" + esc(it.text_zh || it.text) + "</div>" + (it.text_zh ? '<div class="orig">原文：' + esc(it.text) + "</div>" : "") + "</div>";
          txt.push("・" + labels.join("、") + " " + (it.text_zh || it.text));
        });
      }
      html += '<a class="site" href="' + esc(p.url) + '" target="_blank" rel="noopener">開啟官網確認</a></section>';
      txt.push("");
    });

    $("results").innerHTML = '<div class="summary">' + esc(rangeTxt) + "，共找到 " + total + " 筆</div>" + html;
    $("actions").classList.remove("hidden");
    lastText = txt.join("\n").trim();
    store("range", s + "|" + e);
    $("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function copy() {
    if (!lastText) return;
    var done = function () { toast("已複製，可貼到 LINE"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastText).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = lastText; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("複製失敗"); }
      document.body.removeChild(ta);
    }
  }

  // 初始化
  var r = (load("range") || "").split("|");
  if (r.length === 2 && r[1] >= ymd(new Date())) { $("start").value = r[0]; $("end").value = r[1]; }
  else setRange(7);

  Array.prototype.forEach.call(document.querySelectorAll(".quick button"), function (b) {
    b.onclick = function () { setRange(+b.getAttribute("data-q")); };
  });
  $("go").onclick = search;
  $("copy").onclick = copy;

  fetch("data.json?t=" + Date.now()).then(function (res) {
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }).then(function (d) {
    DATA = d;
    window.PARK_DATA = d;
    $("updated").textContent = "資料更新：" + d.generated_at + "（每天自動更新）";
    $("meta").textContent = "可查詢範圍：" + d.window[0] + " ~ " + d.window[1] + "。實際狀況以各樂園官網為準。";
    buildParks();
  }).catch(function () {
    $("updated").textContent = "資料讀取失敗，請稍後重新整理";
  });
})();
// ================= 購票提醒 =================
(function () {
  var API_URL = "https://script.google.com/macros/s/AKfycbzAw3TXOO5bs84CAFpNz2xLjbPyBDAmxJaqTdopOqit1GtTtLd-lTFlgqmAdfkEP0Z0zg/exec";  // Apps Script 網頁應用程式網址
  var rItem = "usj";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function key() { try { return localStorage.getItem("rKey") || ""; } catch (e) { return ""; } }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2500); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function api(params) {
    if (!API_URL) return Promise.reject(new Error("購票提醒還沒接上芊芊助手"));
    params.key = key();
    var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return fetch(API_URL + "?" + q).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "發生錯誤");
      return d;
    });
  }

  // 本機先算開賣時間（和 Apps Script 規則相同）
  function localPreview(item, visit) {
    var p = visit.split("-").map(Number), y = p[0], m = p[1], d = p[2], sale;
    if (item === "suzuka") sale = Date.UTC(y, m - 1, d - 42);
    else {
      m -= 2; if (m < 1) { m += 12; y -= 1; }
      d = Math.min(d, new Date(Date.UTC(y, m, 0)).getUTCDate());
      sale = Date.UTC(y, m - 1, d);
    }
    sale -= 9 * 3600000;                      // 日本 00:00
    var tw = new Date(sale + 8 * 3600000);    // 台灣時間
    var nt = new Date(Date.UTC(tw.getUTCFullYear(), tw.getUTCMonth(), tw.getUTCDate() - 1, 21));
    var wd = "日一二三四五六";
    function f(t) { return (t.getUTCMonth() + 1) + "/" + t.getUTCDate() + "（週" + wd[t.getUTCDay()] + "）" + pad(t.getUTCHours()) + ":" + pad(t.getUTCMinutes()); }
    return { sale: f(tw), notify: f(nt), salePast: sale < Date.now(), notifyPast: nt.getTime() - 8 * 3600000 < Date.now() };
  }

  function maint(visit) {
    var data = window.PARK_DATA;
    if (!data) return "";
    var p = data.parks.filter(function (x) { return x.id === "suzuka"; })[0];
    if (!p || p.status !== "ok") return "";
    var hits = p.items.filter(function (it) { return it.periods.some(function (q) { return q[0] <= visit && (q[1] === null || q[1] >= visit); }); });
    return hits.length ? "入園日維修：" + hits.map(function (it) { return it.text_zh || it.text; }).join("、") : "入園日維修：目前沒有";
  }

  function render(list) {
    if (!list.length) { $("rList").innerHTML = '<div class="none">目前沒有提醒</div>'; return; }
    $("rList").innerHTML = list.map(function (r) {
      return '<div class="rem"><button class="del" data-id="' + r.id + '">刪除</button>' +
        '<div class="t">' + esc(r.itemName) + "｜入園 " + esc(r.visit) + "</div>" +
        (r.note ? "<div>" + esc(r.note) + "</div>" : "") +
        '<span class="tag">開賣 ' + esc(r.sale) + "</span>" +
        '<span class="tag' + (r.sent ? " done" : "") + '">' + (r.sent ? "已提醒" : "LINE 提醒 " + esc(r.notify)) + "</span>" +
        (r.item === "suzuka" ? '<div class="mt">' + esc(maint(r.visitRaw)) + "</div>" : "") + "</div>";
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#rList .del"), function (b) {
      b.onclick = function () {
        if (!confirm("確定刪除這筆提醒？")) return;
        api({ action: "delete", id: b.getAttribute("data-id") }).then(function (d) { render(d.list); }, function (e) { toast(e.message); });
      };
    });
  }

  function load() {
    api({ action: "list" }).then(function (d) { render(d.list); }, function (e) { $("rList").innerHTML = '<div class="error">' + esc(e.message) + "</div>"; });
  }

  function updatePreview() {
    var v = $("rVisit").value; if (!v) return;
    var p = localPreview(rItem, v);
    $("rPreview").innerHTML = "開賣：台灣時間 " + esc(p.sale) + "<br>LINE 提醒：" + esc(p.notify) +
      (p.salePast ? '<br><span class="warn">已經開賣了，請直接去購買</span>' : p.notifyPast ? '<br><span class="warn">提醒時間已過，加入後會立刻補發</span>' : "") +
      (rItem === "suzuka" ? "<br>" + esc(maint(v)) : "");
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (x) { x.classList.toggle("on", x === b); });
      var t = b.getAttribute("data-tab");
      $("tab-check").classList.toggle("hidden", t !== "check");
      $("tab-remind").classList.toggle("hidden", t !== "remind");
      if (t === "remind") load();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".item2"), function (b) {
    b.onclick = function () {
      rItem = b.getAttribute("data-item");
      Array.prototype.forEach.call(document.querySelectorAll(".item2"), function (x) { x.classList.toggle("on", x === b); });
      updatePreview();
    };
  });
  $("rVisit").onchange = updatePreview;
  $("rKey").value = key();
  $("rSaveKey").onclick = function () { try { localStorage.setItem("rKey", $("rKey").value.trim()); } catch (e) {} toast("已儲存"); load(); };
  $("rTest").onclick = function () { api({ action: "test" }).then(function (d) { toast(d.message); }, function (e) { toast(e.message); }); };
  $("rAdd").onclick = function () {
    var v = $("rVisit").value;
    if (!v) { toast("請先選入園日期"); return; }
    $("rAdd").disabled = true;
    api({ action: "add", item: rItem, visit: v, note: $("rNote").value }).then(function (d) {
      render(d.list); $("rNote").value = ""; toast("已加入提醒，開賣前一天 21:00 會收到 LINE");
    }, function (e) { toast(e.message); }).then(function () { $("rAdd").disabled = false; });
  };
})();
</script>
</body>
</html>
