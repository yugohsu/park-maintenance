name: 每日更新樂園維修資料

on:
  schedule:
    - cron: "17 21 * * *"   # 每天台灣時間 05:17
    - cron: "17 9 * * *"    # 每天台灣時間 17:17
  workflow_dispatch:         # 可在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 抓取各樂園資料
        run: python park_maintenance_checker.py --export docs/data.json --days 240
      - name: 存回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "更新維修資料 $(date -u +%F)"
          git push
